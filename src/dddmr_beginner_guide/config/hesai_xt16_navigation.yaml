p2p_move_base:
  ros__parameters:
    controller_frequency: 10.0                  # 控制器频率
    planner_patience: 10.0                      # 全局规划X秒仍算不出有效路径就触发恢复
    oscillation_distance: 5.0                   # 判断是否卡住的距离阈值（米）
    oscillation_angle: 1.0                      # 判断是否卡住的角度阈值（弧度）
    oscillation_patience: 15.0                  # 判断卡住后，最多再坚持 X 秒才强制进入恢
    controller_patience: 10.0                  # 局部控制器超时X秒仍算不出有效速度就触发恢复
    no_plan_retry_num: 10                      # 全局规划失败后，恢复行为最多尝试次数
    waiting_patience: 10.0                     # 进入等待状态（如感知冲突、暂不可行）后，最多等X 秒 再重新全局规划
global_plan_manager:
  ros__parameters:
    global_planner_action_name: "get_dwa_plan"
    global_plan_query_frequency: 5.0

mcl_ip:
  ros__parameters:
    # Hesai XT16
    laser:
        odom_type: "wheel_odometry"         #wheel_odometry/laser_odometry 
        base_ground_frame: "base_link"
        num_vertical_scans: 16
        num_horizontal_scans: 1000
        vertical_angle_bottom: -15.0          # degrees
        vertical_angle_top: 15.0            # degrees
        scan_period: 0.1                   # seconds


    imageProjection:
        segment_valid_point_num: 5
        segment_valid_line_num: 2
        segment_theta: 60.0                      # decrese this value may improve accuracy
        minimum_detection_range: 0.5
        maximum_detection_range: 100.0            # point cloud within this range will be used to project image
        distance_for_patch_between_rings: 1.0    # patch ground between rings within this range, i.e. ring0 and ring1 is smaller than 1 meter, patch them
        stitcher_num: 0                          # for non-repetitive scan lidar use 2~4 (i.e. mid360)
        trt_model_path: ""                       # provide trt engine for yolo
        projected_image_stack_size: 1            # Stack this number of image for yolo11n to inference as time elapsed yolo (only work when TRT is loaded)
        patch_first_ring_to_baselink: true      
        ground_slope_tolerance: 0.34
        ground_dz_tolerance: 0.15
        
        ground_fov_bottom: -0.2617994 # -15deg    调整地面视野参数，确保你第一帧的地面不是空心的，然后慢慢移动机器人，看看地面是否完美构建
        ground_fov_top: -0.087266 # -5deg
        ground_positive_start: 0.0
        ground_positive_stop: 3.1415926
        ground_negative_start: 0.0
        ground_negative_stop: -3.1415926
        
mcl_fa:
  ros__parameters:

    featureAssociation:
        edge_threshold: 0.1
        surf_threshold: 0.1
        nearest_feature_search_distance: 3.0
        
sub_maps:
  ros__parameters:
    pose_graph_dir: "/root/dddmr_bags/2026_03_28_19_25_15"      # 需修改为pcd地图的实际路径
    sub_map_search_radius: 50.0
    sub_map_warmup_trigger_distance: 20.0
    complete_map_voxel_size: 0.2                                # 完整地图的体素大小，越大越粗糙，默认0.4
# 重定位mcl_3dl
mcl_3dl:
  ros__parameters:
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_roll: 0.0
    init_pitch: 0.0
    init_yaw: 0.0
    init_var_x: 2.0
    init_var_y: 2.0
    init_var_z: 0.5
    init_var_roll: 0.1
    init_var_pitch: 0.1
    init_var_yaw: 0.5
    map_frame: "map"
    robot_frame: "base_link"
    odom_frame: "odom"
    map_downsample_x: 0.1
    map_downsample_y: 0.1
    map_downsample_z: 0.1
    map_update_interval_sec: 2 #int
    num_particles: 60

    resample_var_x: 0.2
    resample_var_y: 0.2
    resample_var_z: 0.2
    resample_var_yaw: 0.1
    resample_var_pitch: 0.2
    resample_var_roll: 0.2
    expansion_var_x: 0.5
    expansion_var_y: 0.5
    expansion_var_z: 0.5
    expansion_var_roll: 0.2
    expansion_var_pitch: 0.2
    expansion_var_yaw: 0.2
    match_ratio_thresh: 0.0

    euc_cluster_distance: 0.8
    euc_cluster_min_size: 3
    euc_cluster_max_size: 2400

    knn_num_of_ground_normals: 20

    update_min_d: 0.1
    update_min_a: 0.1

    odom_err_lin_lin: 0.6
    odom_err_lin_ang: 0.3
    odom_err_ang_lin: 0.3
    odom_err_ang_ang: 0.6

    odom_err_integ_lin_tc: 5.0
    odom_err_integ_ang_tc: 10.0

    lpf_step: 2.0
    acc_lpf_step: 128.0

    jump_dist: 1.0
    jump_ang: 1.57

    bias_var_dist: 2.0
    bias_var_ang: 1.57
    tf_tolerance: 0.1
    publish_tf: true

    likelihood:
      num_points_global: 8
      match_dist_min: 0.3
      match_dist_flat: 0.05
      threshold_for_trusted_ground: 6
      radius_of_ground_search: 1.0

local_planner:
  ros__parameters:
    odom_topic: odom
    forward_prune: 3.0
    backward_prune: 1.0
    heading_tracking_distance: 0.5
    heading_align_angle: 0.5
    prune_plane_timeout: 3.0
    xy_goal_tolerance: 0.3                  # 到目标点的 3D 欧氏距离容差
    yaw_goal_tolerance: 0.3                  # 到目标点的 yaw 角度容差
    controller_frequency: 10.0
    
    cuboid:
      flb: [0.34, 0.18, -0.32] # 基于base_link的坐标系，左前底
      frb: [0.34, -0.17, -0.32] # 基于base_link的坐标系，右前底
      flt: [0.34, 0.18, 0.19] # 基于base_link的坐标系，左前顶
      frt: [0.34, -0.17, 0.19] # 基于base_link的坐标系，右前顶
      blb: [-0.34, 0.18, -0.32] # 基于base_link的坐标系，左后底
      brb: [-0.34, -0.17, -0.32] # 基于base_link的坐标系，右后底
      blt: [-0.34, 0.18, 0.19] # 基于base_link的坐标系，左后顶
      brt: [-0.34, -0.17, 0.19] # 基于base_link的坐标系，右后顶

recovery_behaviors:
  ros__parameters:
    plugins: ["rotate_inplace"]
    rotate_inplace:
      plugin: "recovery_behaviors::RotateInPlaceBehavior"
      frequency: 10.0
      tolerance: 0.3
      trajectory_generator_name: "differential_drive_rotate_inplace"

trajectory_generators:
  ros__parameters:
    plugins: ["differential_drive_simple", "differential_drive_rotate_inplace", "differential_drive_rotate_shortest_angle"]
    differential_drive_rotate_shortest_angle:
      plugin: "trajectory_generators::DDRotateInplaceTheory"
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid:
        flb: [0.34, 0.18, -0.32] # 基于base_link的坐标系，左前底
        frb: [0.34, -0.17, -0.32] # 基于base_link的坐标系，右前底
        flt: [0.34, 0.18, 0.19] # 基于base_link的坐标系，左前顶
        frt: [0.34, -0.17, 0.19] # 基于base_link的坐标系，右前顶
        blb: [-0.34, 0.18, -0.32] # 基于base_link的坐标系，左后底
        brb: [-0.34, -0.17, -0.32] # 基于base_link的坐标系，右后底
        blt: [-0.34, 0.18, 0.19] # 基于base_link的坐标系，左后顶
        brt: [-0.34, -0.17, 0.19] # 基于base_link的坐标系，右后顶

    differential_drive_rotate_inplace:
      plugin: "trajectory_generators::DDRotateInplaceTheory"
      controller_frequency: 10.0
      rotation_speed: 0.5
      cuboid:
        flb: [0.34, 0.18, -0.32] # 基于base_link的坐标系，左前底
        frb: [0.34, -0.17, -0.32] # 基于base_link的坐标系，右前底
        flt: [0.34, 0.18, 0.19] # 基于base_link的坐标系，左前顶
        frt: [0.34, -0.17, 0.19] # 基于base_link的坐标系，右前顶
        blb: [-0.34, 0.18, -0.32] # 基于base_link的坐标系，左后底
        brb: [-0.34, -0.17, -0.32] # 基于base_link的坐标系，右后底
        blt: [-0.34, 0.18, 0.19] # 基于base_link的坐标系，左后顶
        brt: [-0.34, -0.17, 0.19] # 基于base_link的坐标系，右后顶
    
    differential_drive_simple:
      plugin: "trajectory_generators::DDSimpleTrajectoryGeneratorTheory"
      max_vel_x: 1.0
      min_vel_x: 0.1 #0.1 This value should not be negative, because we want to customize backward behavior
      max_vel_theta: 0.6
      min_vel_theta: 0.15
      acc_lim_x: 1.0
      acc_lim_theta: 3.0
      deceleration_ratio: 2.0
      max_motor_shaft_rpm: 3000.0
      wheel_diameter: 0.16
      gear_ratio: 1.0
      robot_radius: 0.25
      
      controller_frequency: 10.0
      sim_time: 2.0
      linear_x_sample: 5.0
      angular_z_sample: 10.0
      sim_granularity: 0.05
      angular_sim_granularity: 0.025

      cuboid:
        flb: [0.34, 0.18, -0.32] # 基于base_link的坐标系，左前底
        frb: [0.34, -0.17, -0.32] # 基于base_link的坐标系，右前底
        flt: [0.34, 0.18, 0.19] # 基于base_link的坐标系，左前顶
        frt: [0.34, -0.17, 0.19] # 基于base_link的坐标系，右前顶
        blb: [-0.34, 0.18, -0.32] # 基于base_link的坐标系，左后底
        brb: [-0.34, -0.17, -0.32] # 基于base_link的坐标系，右后底
        blt: [-0.34, 0.18, 0.19] # 基于base_link的坐标系，左后顶
        brt: [-0.34, -0.17, 0.19] # 基于base_link的坐标系，右后顶

mpc_critics:
  ros__parameters:
    plugins: ["collision", "stick_path", "pure_pursuit", "toward_global_plan", "collision_rotate", "collision_rotate_shortest", "prefer_rotate_shortest"]
    collision:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_simple
      weight: 1.0
    stick_path:
      plugin: "mpc_critics::StickPathModel"
      trajectory_generator: differential_drive_simple
      weight: 0.1
    pure_pursuit:
      plugin: "mpc_critics::PurePursuitModel"
      trajectory_generator: differential_drive_simple
      translation_weight: 1.0
      orientation_weight: 0.01
    toward_global_plan:
      plugin: "mpc_critics::TowardGlobalPlanModel"
      trajectory_generator: differential_drive_simple
      weight: 1.0
    collision_rotate:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_rotate_inplace
      weight: 1.0
    collision_rotate_shortest:
      plugin: "mpc_critics::CollisionModel"
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0    
    prefer_rotate_shortest:
      plugin: "mpc_critics::ShortestAngleModel"
      trajectory_generator: differential_drive_rotate_shortest_angle
      weight: 1.0
      
# 局部规划 / 避障 用的 3D 感知栈
perception_3d_local:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.2                 # 障碍物膨胀半径  默认0.5，走廊时降到0.2
    inflation_descending_rate: 2.0        # 若希望路径更贴中线,2.5 以上，更贴边则 2.0 以下
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "path_blocked_strategy", "lidar"]
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: true
      mapping_mode: false
      map_topic: "mapcloud"
      ground_topic: "mapground"
    path_blocked_strategy:
      plugin: "perception_3d::PathBlockedStrategy"
      check_radius: 0.3
    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: true
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: false
      vertical_FOV_top: 15.0
      vertical_FOV_bottom: -15.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0           # base_link 系下 z 过滤上界
      perception_window_size: 3.0 # 标记/清除的窗口大小（米），即使对于全局地图，也不会投射到传感器的最大范围
      segmentation_ignore_ratio: 0.5 # 如果分割结果与静态点云的匹配比例达到此值，则忽略（例如：一堵墙）
 
      expected_sensor_time: 0.2

perception_3d_global:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    max_obstacle_distance: 9999.0
    inscribed_radius: 0.2                   # 障碍物膨胀半径  默认0.5，走廊时降到0.2
    inflation_descending_rate: 2.0          # 若希望路径更贴中线,2.5 以上，更贴边则 2.0 以下
    inflation_radius: 1.5
    sensors_collected_frequency: 10.0
    plugins: ["map", "lidar"]
    dgraph_publish_frequency: 1.0
    map:
      plugin: "perception_3d::StaticLayer"
      is_local_planner: false
      use_adaptive_connection: false #If true: the neighbors of node is sparse, it will automatically increase search radius.
      adaptive_connection_number: 20
      radius_of_ground_connection: 1.5 #If use_adaptive_connection=false, the radius search of the node is applied.
      intensity_search_radius: 1.0 #this value is suggested to be 1.0 meters, because if it is too large, the narrow passage will be miscalculated
      intensity_search_punish_weight: 0.1 #the weight for a node. Set this value higher means we dont like path planning cross a orphan node.
      static_imposing_radius: 1.5 #use map to add weight on each ground node
      map_topic: "mapcloud"
      ground_topic: "mapground"
      support:
        mapping_mode: false
          #如果mapping_mode为true，则边缘检测会自动禁用
        enable_edge_detection: true
        generate_static_graph: false
          #将使用连接半径
          #当地面非常稠密（例如地面体素大小<=10厘米）时启用此选项
  

    lidar:
      plugin: "perception_3d::MultiLayerSpinningLidar"
      is_local_planner: false
      topic: "segmented_cloud_pure"
      pub_gbl_marking_for_visualization: true
      vertical_FOV_top: 15.0
      vertical_FOV_bottom: -15.0
      scan_effective_positive_start: 30.0
      scan_effective_positive_end: 180.0
      scan_effective_negative_start: -30.0
      scan_effective_negative_end: -180.0
      euclidean_cluster_extraction_tolerance: 0.1
      euclidean_cluster_extraction_min_cluster_size: 1
      xy_resolution: 0.05
      height_resolution: 0.05
      marking_height: 2.0
      perception_window_size: 5.0 #the window for marking/clearing in meter, we dont casting to maximum range of the sensor even it is gbl map
      segmentation_ignore_ratio: 1.1 #f a segmentation match static pc with this ratio, we ignore it. ex: a wall
      expected_sensor_time: 0.1

global_planner:
  ros__parameters:
    turning_weight: 0.1 #Punish the zig-zag path
    enable_detail_log: false
    a_star_expanding_radius: 0.2            # A* 扩展半径，默认0.5，走廊时降到0.2

#if we use get_dwa_plan in global_plan_manager, we setup parameters for dwa_global_planner
dynamic_window_aware_global_planner:
  ros__parameters:
    look_ahead_distance: 2.0
    recompute_frequency: 10.0
    